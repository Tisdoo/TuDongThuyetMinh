server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Cache-Control "no-cache";

  # DNS noi bo cua Docker. Dung bien de nginx van khoi dong duoc ngay ca khi api-gateway chua chay.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway http://api-gateway:8080;

  location /api/ {
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Audio thuyet minh do content-worker tao (volume dung chung, chi doc)
  location /audio/ {
    alias /usr/share/nginx/audio/;
    add_header Cache-Control "public, max-age=86400";
  }

  # Quầy nhân viên dùng chung cổng 5175 (một đường ngrok là đủ)
  location = /staff { return 301 /staff/; }
  location /staff/ {
    alias /usr/share/nginx/staff/;
    index staff.html;
  }

  location = /admin { return 301 /admin/; }
  location /admin/ {
    root /usr/share/nginx;
    index index.html;
  }

  location / {
    try_files $uri /index.html;
  }
}
