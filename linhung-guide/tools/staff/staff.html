<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quầy nhân viên - Chùa Linh Ứng</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#222}
  h1{font-size:1.3rem} h2{font-size:1.05rem;margin-top:28px}
  input,button{font:inherit;padding:8px 10px;margin:4px 4px 4px 0}
  button{cursor:pointer} .primary{background:#b91c1c;color:#fff;border:0;border-radius:6px}
  .card{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}
  .code{font-size:3rem;letter-spacing:.3em;font-weight:700;text-align:center;margin:10px 0}
  .err{color:#b91c1c} .ok{color:#15803d} .muted{color:#666;font-size:.9rem}
  table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid #eee;padding:6px;text-align:left}
  .hidden{display:none}
</style>
</head>
<body>
<h1>Quầy nhân viên - xác nhận thu tiền mặt</h1>
<p class="muted">API: <span id="apiBase"></span></p>

<section id="loginBox" class="card">
  <b>Đăng nhập</b><br>
  <input id="user" placeholder="Tên đăng nhập" value="staff1">
  <input id="pass" type="password" placeholder="Mật khẩu" value="Staff@12345">
  <button class="primary" id="btnLogin">Đăng nhập</button>
  <div id="loginMsg" class="err"></div>
</section>

<section id="main" class="hidden">
  <p>Đã đăng nhập: <b id="who"></b> <button id="btnLogout">Đăng xuất</button></p>

  <h2>1. Đơn tiền mặt đang chờ <span class="muted">(tự làm mới mỗi 5 giây)</span></h2>
  <div id="pending" class="card muted">Đang tải...</div>

  <h2>2. Tìm đơn theo mã</h2>
  <input id="orderCode" placeholder="Mã đơn khách đọc" maxlength="12">
  <button id="btnFind">Tìm</button>
  <div id="orderBox" class="card hidden"></div>

  <h2>3. Mã truy cập cho khách</h2>
  <div id="codeBox" class="card hidden">
    <div class="muted">Đọc mã này cho khách nhập vào ứng dụng:</div>
    <div class="code" id="shortCode">------</div>
    <div class="muted">Hết hạn sau <span id="ttl">0</span> giây</div>
    <button id="btnReissue">Cấp lại mã</button>
  </div>
  <div id="msg"></div>
</section>

<script>
const API = 'http://localhost:8080/api';
document.getElementById('apiBase').textContent = API;
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem('staffToken') || '';
let currentOrder = null;
let ttlTimer = null;

function say(text, cls) { $('msg').innerHTML = ''; const d = document.createElement('div'); d.className = cls || ''; d.textContent = text; $('msg').appendChild(d); }

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: { ...(body ? { 'content-type': 'application/json' } : {}), ...(token ? { authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null; try { data = await res.json(); } catch {}
  if (res.status === 401 && token) { logout(); throw new Error('Phiên hết hạn, đăng nhập lại'); }
  return { status: res.status, data };
}

async function login() {
  $('loginMsg').textContent = '';
  const r = await fetch(API + '/auth/staff/login', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ username: $('user').value, password: $('pass').value }),
  });
  const data = await r.json();
  if (!r.ok) { $('loginMsg').textContent = data?.error?.code || 'Lỗi đăng nhập'; return; }
  token = data.accessToken; sessionStorage.setItem('staffToken', token);
  $('who').textContent = $('user').value + ' (' + data.role + ')';
  showMain();
}
function logout() { token = ''; sessionStorage.removeItem('staffToken'); $('main').classList.add('hidden'); $('loginBox').classList.remove('hidden'); }
function showMain() { $('loginBox').classList.add('hidden'); $('main').classList.remove('hidden'); loadPending(); }

async function loadPending() {
  if (!token) return;
  try {
    const { data } = await api('GET', '/payments/admin/orders?method=CASH&status=PENDING&pageSize=20');
    const box = $('pending'); box.innerHTML = '';
    if (!data.items?.length) { box.textContent = 'Không có đơn nào đang chờ.'; return; }
    const t = document.createElement('table');
    t.innerHTML = '<tr><th>Mã đơn</th><th>Số tiền</th><th>Tạo lúc</th><th></th></tr>';
    for (const o of data.items) {
      const tr = document.createElement('tr');
      for (const v of [o.order_code, o.amount.toLocaleString('vi-VN') + ' đ', new Date(o.created_at).toLocaleTimeString('vi-VN')]) {
        const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      }
      const td = document.createElement('td'); const b = document.createElement('button'); b.textContent = 'Chọn';
      b.onclick = () => { $('orderCode').value = o.order_code; findOrder(); };
      td.appendChild(b); tr.appendChild(td); t.appendChild(tr);
    }
    box.appendChild(t);
  } catch (e) { /* bỏ qua, lần sau thử lại */ }
}

async function findOrder() {
  $('codeBox').classList.add('hidden'); say('');
  const code = $('orderCode').value.trim();
  if (!code) return;
  const { status, data } = await api('GET', '/payments/admin/orders/by-code/' + encodeURIComponent(code));
  const box = $('orderBox'); box.classList.remove('hidden'); box.innerHTML = '';
  if (status !== 200) { currentOrder = null; box.textContent = 'Không tìm thấy đơn.'; box.className = 'card err'; return; }
  currentOrder = data; box.className = 'card';
  const info = document.createElement('div');
  info.textContent = `Đơn ${data.order_code} | ${data.method} | ${data.status} | ${Number(data.amount).toLocaleString('vi-VN')} đ | ${data.product_name}`;
  box.appendChild(info);
  if (data.method === 'CASH' && data.status === 'PENDING') {
    const b = document.createElement('button'); b.className = 'primary'; b.textContent = 'Xác nhận ĐÃ THU ' + Number(data.amount).toLocaleString('vi-VN') + ' đ';
    b.onclick = confirmCash; box.appendChild(b);
  } else if (data.method === 'CASH' && data.status === 'PAID') {
    const b = document.createElement('button'); b.textContent = 'Lấy / cấp lại mã'; b.onclick = fetchShortCode; box.appendChild(b);
  } else { const n = document.createElement('div'); n.className = 'err'; n.textContent = 'Đơn này không thể xác nhận thu tiền mặt.'; box.appendChild(n); }
}

async function confirmCash() {
  const { status, data } = await api('POST', `/payments/admin/orders/${currentOrder.id}/confirm-cash`, { amountReceived: Number(currentOrder.amount) });
  if (status !== 200) { say('Lỗi: ' + (data?.error?.code || status), 'err'); return; }
  say('Đã ghi nhận thu tiền. Đang lấy mã...', 'ok');
  fetchShortCode(); loadPending(); findOrder();
}

// Auth Service sinh mã sau khi nhận event => có thể trả 202 vài lần
async function fetchShortCode() {
  for (let i = 0; i < 10; i++) {
    const { status, data } = await api('GET', `/auth/staff/orders/${currentOrder.id}/short-code`);
    if (status === 200) return showCode(data.shortCode, data.expiresInSec);
    if (status === 410) { return reissue(); }
    if (status !== 202) { say('Lỗi: ' + (data?.error?.code || status), 'err'); return; }
    await new Promise((r) => setTimeout(r, 1000));
  }
  say('Chưa có mã, thử lại sau ít giây.', 'err');
}

async function reissue() {
  const { status, data } = await api('POST', `/auth/staff/orders/${currentOrder.id}/short-code/reissue`);
  if (status !== 200) { say('Không cấp lại được: ' + (data?.error?.code || status), 'err'); return; }
  showCode(data.shortCode, data.expiresInSec);
}

function showCode(code, ttl) {
  $('codeBox').classList.remove('hidden'); $('shortCode').textContent = code; say('');
  clearInterval(ttlTimer); let left = ttl; $('ttl').textContent = left;
  ttlTimer = setInterval(() => { left--; $('ttl').textContent = Math.max(left, 0); if (left <= 0) clearInterval(ttlTimer); }, 1000);
}

$('btnLogin').onclick = login; $('btnLogout').onclick = logout; $('btnFind').onclick = findOrder; $('btnReissue').onclick = reissue;
$('orderCode').addEventListener('keydown', (e) => { if (e.key === 'Enter') findOrder(); });
setInterval(loadPending, 5000);
if (token) { $('who').textContent = 'nhân viên'; showMain(); }
</script>
</body>
</html>
