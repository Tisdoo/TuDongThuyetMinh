services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  auth-service:
    build: ./services/auth-service
    environment:
      PORT: 4001
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-key}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_DEV_ACCOUNTS: ${SEED_DEV_ACCOUNTS:-true}
      PII_KEY: ${PII_KEY:-dev-pii-key-change-me}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  payment-service:
    build: ./services/payment-service
    environment:
      PORT: 4002
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/payment_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_URL: http://auth-service:4001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-key}
      PAYOO_MODE: ${PAYOO_MODE:-mock}
      PAYOO_CHECKSUM_KEY: ${PAYOO_CHECKSUM_KEY:-change-me-checksum-key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5175}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5175}
      SELF_URL: http://payment-service:4002
      MOMO_QR_URL: ${MOMO_QR_URL:-/momo-qr.svg}
      MOMO_ACCOUNT_NAME: ${MOMO_ACCOUNT_NAME:-}
      ONLINE_PAYMENT_PROVIDER: ${ONLINE_PAYMENT_PROVIDER:-payoo}
      VNP_TMN_CODE: ${VNP_TMN_CODE:-}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:-}
      VNP_URL: ${VNP_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  poi-service:
    build: ./services/poi-service
    environment:
      PORT: 4003
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/poi_db
    volumes:
      - poi_storage:/app/storage
    depends_on:
      postgres: { condition: service_healthy }

  api-gateway:
    build: ./services/api-gateway
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379
      AUTH_URL: http://auth-service:4001
      PAYMENT_URL: http://payment-service:4002
      POI_URL: http://poi-service:4003
      CHAT_URL: http://chatbot-service:4004
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
    depends_on: [auth-service, payment-service, poi-service, redis]

  # Phuc vu trang quay nhan vien tai http://localhost:5174/staff.html (khong can Node/Python)
  # Dich tu dong + tao audio (Edge-TTS). Can Internet.
  content-worker:
    build: ./services/content-worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/poi_db
      AUDIO_DIR: /data/audio
    volumes:
      - audio_data:/data/audio
    depends_on:
      postgres: { condition: service_healthy }
      poi-service: { condition: service_started }

  staff-ui:
    image: nginx:alpine
    ports: ["5174:80"]
    volumes:
      - ./tools/staff:/usr/share/nginx/html:ro

  # Web App du khách (http://localhost:5175) và trang quản trị POI (http://localhost:5175/admin/)
  web:
    image: nginx:alpine
    ports: ["5175:80"]
    volumes:
      - ./infra/nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tools/tourist:/usr/share/nginx/html:ro
      - ./tools/admin:/usr/share/nginx/admin:ro
      - ./tools/staff:/usr/share/nginx/staff:ro
      - audio_data:/usr/share/nginx/audio:ro
    depends_on: [api-gateway]

volumes:
  pgdata:
  poi_storage:
  audio_data:
