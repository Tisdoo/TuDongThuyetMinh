<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8f1d22">
<title>Hành trình cùng SGU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>

:root{
  --bar:60px; --nav:64px;
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#eceae4; --ink:#1c1f1e; --muted:#5d6461; --line:#dcdad3;
  --red:#8f1d22; --red-2:#b3262d; --on-red:#ffffff; --gold:#a8741c; --sea:#17656e; --ok:#1f7a3f;
  --shadow:0 1px 2px rgba(20,20,20,.06), 0 6px 20px rgba(20,20,20,.07);
  --r:14px;
  --font:"Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#121514; --surface:#1a1e1d; --surface-2:#232827; --ink:#e8eae6; --muted:#a3aba7; --line:#2d3331;
  --red:#d9545a; --red-2:#e8686e; --on-red:#1b0b0c; --gold:#d8a64e; --sea:#5fb2ba; --ok:#6fd393;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35); color-scheme:dark; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
img{max-width:100%}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:.86rem} .err{color:var(--red)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* ---------- Thanh trên ---------- */
.appbar{position:fixed;top:0;left:0;right:0;height:calc(var(--bar) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(14px, env(safe-area-inset-right,0px)) 0 max(14px, env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px;background:var(--surface);border-bottom:1px solid var(--line);z-index:1200}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand svg{flex:none}
.brand b{display:block;font-weight:800;font-size:1.02rem;letter-spacing:-.2px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:.74rem;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--surface-2);color:var(--ink)}
.spacer{flex:1}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.86rem;white-space:nowrap}
.pill.buy{background:var(--red);border-color:var(--red);color:var(--on-red)}
.pill.ok{color:var(--ok)}
.langbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.8rem;flex:none}
.menu{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top,0px) + 6px);right:max(10px, env(safe-area-inset-right,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:1500;min-width:190px;overflow:hidden;padding:4px}
.menu button{display:flex;justify-content:space-between;width:100%;padding:11px 14px;border:0;background:none;text-align:left;cursor:pointer;border-radius:8px}
.menu button:hover{background:var(--surface-2)}
.menu button.active{font-weight:700;color:var(--red)}

/* ---------- Thanh dưới (điện thoại) ---------- */
.bottomnav{display:none}
@media (max-width:760px){
  .tabs,.appbar .pill{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);z-index:1200}
  .bottomnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.74rem;color:var(--muted);cursor:pointer;font-weight:600}
  .bottomnav button svg{width:22px;height:22px}
  .bottomnav button.on{color:var(--red)}
}

/* ---------- Khung trang ---------- */
.view{padding-top:calc(var(--bar) + env(safe-area-inset-top,0px))}
@media (max-width:760px){ .view{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 12px)} }
.container{max-width:1180px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}

/* ---------- Trang chủ: chào mừng ---------- */
.hero{position:relative;overflow:hidden;color:#fff;background:#0f3a3f}
.hero .art{position:absolute;inset:0;width:100%;height:100%}
.hero .photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .6s}
.hero .photo.on{opacity:1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,20,22,.15) 0%,rgba(8,20,22,.55) 60%,rgba(8,20,22,.8) 100%)}
.hero .in{position:relative;z-index:1;padding-block:56px 30px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#f3d38e}
.hero .eyebrow::before{content:"";width:22px;height:2px;background:#f3d38e}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.08;margin:10px 0 6px;font-weight:800;letter-spacing:-1px;text-wrap:balance;max-width:16ch}
.hero .place{font-weight:600;opacity:.9}
.hero p.intro{max-width:56ch;opacity:.92;margin:12px 0 18px}
.langchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.langchips button{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;backdrop-filter:blur(4px)}
.langchips button.on{background:#fff;color:#14302f;border-color:#fff}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover{background:var(--red-2)}
.btn.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);color:#fff}
.btn.block{display:flex;width:100%}
.btn.sm{padding:8px 12px;border-radius:10px;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:default}

.status{margin-top:-22px;position:relative;z-index:2}
.status .card{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.status .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--red);flex:none}
.status .ic.ok{color:var(--ok)}
.status .tx{flex:1;min-width:200px}
.status .tx b{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}

.sechead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 12px}
.sechead h2{margin:0;font-size:1.35rem;letter-spacing:-.3px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:14px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Khối "Cách hoạt động" */
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.how li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.how .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:var(--on-red);font-weight:800;font-size:.86rem}

/* Thẻ POI kiểu Google */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px;padding-bottom:32px}
.poi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s, box-shadow .15s;text-align:left;padding:0}
.poi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.poi .img{position:relative;aspect-ratio:4/3;background:var(--surface-2)}
.poi .img img{width:100%;height:100%;object-fit:cover;display:block}
.poi .num{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:.78rem;padding:3px 9px;border-radius:999px}
.poi .play{position:absolute;right:12px;bottom:-22px;width:48px;height:48px;border-radius:50%;border:3px solid var(--surface);background:var(--red);color:var(--on-red);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.poi .play svg{width:20px;height:20px}
.poi.playing .play{background:var(--sea)}
.poi .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.poi h3{margin:0;font-size:1.04rem;line-height:1.3;padding-right:46px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--muted)}
.cat{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.cat i{width:8px;height:8px;border-radius:50%;display:inline-block}
.poi p{margin:0;color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.poi .foot{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--sea);font-weight:600;padding-top:6px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* ---------- Trang bản đồ: danh sách | bản đồ ---------- */
#viewMap{position:fixed;inset:calc(var(--bar) + env(safe-area-inset-top,0px)) 0 0 0;padding:0;display:grid;grid-template-columns:minmax(320px,400px) 1fr}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface)}
.side .top{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
.search input{border:0;background:none;outline:none;padding:11px 0;font:inherit;color:var(--ink);flex:1;min-width:0}
.side .chips{margin:0}
.list{overflow-y:auto;flex:1;min-height:0}
.item{display:grid;grid-template-columns:84px 1fr auto;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;background:none;border-left:3px solid transparent;width:100%;text-align:left;border-top:0;border-right:0}
.item:hover{background:var(--surface-2)}
.item.sel{border-left-color:var(--red);background:var(--surface-2)}
.item img{width:84px;height:64px;object-fit:cover;border-radius:10px;display:block;background:var(--surface-2)}
.item b{display:block;line-height:1.3}
.item .s{font-size:.82rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .pl{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--red)}
.item .pl svg{width:16px;height:16px}
.item.playing .pl{background:var(--sea);color:#fff;border-color:var(--sea)}
.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:var(--surface-2)}
.mapmsg{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--surface);padding:8px 14px;border-radius:10px;z-index:1000;box-shadow:var(--shadow);max-width:80%;text-align:center}
.fabs{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:1000}
.fab{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.fab svg{width:20px;height:20px}
.fab.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.pin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:grid;place-items:center;transition:transform .15s}
.pin span{transform:rotate(45deg);color:#fff;font-weight:800;font-size:.78rem}
.pin.near{background:var(--ok)}
.pin.sel{transform:rotate(-45deg) scale(1.25);background:var(--sea)}
.leaflet-container{font-family:var(--font)}
@media (max-width:760px){
  #viewMap{bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));grid-template-columns:1fr;grid-template-rows:46% 54%}
  .mapwrap{grid-row:1}
  .side{grid-row:2;border-right:0;border-top:1px solid var(--line)}
  .item{grid-template-columns:72px 1fr auto}
  .item img{width:72px;height:56px}
}

/* ---------- Banner gần điểm ---------- */
.banner{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:min(560px, calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;z-index:1400;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.banner img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.banner span{flex:1;font-size:.92rem;min-width:0}
.x{border:0;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}

/* ---------- Chi tiết POI ---------- */
.modal{position:fixed;inset:0;z-index:1600;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .back{position:absolute;inset:0;background:rgba(10,14,13,.55)}
.panel{position:relative;background:var(--surface);border-radius:18px;width:min(680px,100%);max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.gallery{position:relative;aspect-ratio:16/9;background:var(--surface-2)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.gallery .dots button{width:8px;height:8px;border-radius:50%;border:0;background:rgba(255,255,255,.55);padding:0;cursor:pointer}
.gallery .dots button.on{background:#fff}
.panel .close{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:1.4rem;cursor:pointer;z-index:2}
.panel .content{padding:18px 20px 22px}
.panel h2{margin:4px 0 6px;font-size:1.45rem;letter-spacing:-.3px;line-height:1.25}
.panel .lead{font-weight:600;margin:10px 0}
.panel .desc{white-space:pre-line}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.lock{border:1px dashed var(--gold);border-radius:12px;padding:14px;margin:12px 0;display:grid;gap:10px;background:color-mix(in srgb, var(--gold) 8%, transparent)}
.lock b{color:var(--gold)}
@media (max-width:760px){
  .modal{align-items:flex-end;padding:0}
  .panel{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px)}
}

/* ---------- Thanh phát ---------- */
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:min(560px, calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:16px;z-index:1450;box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden}
.player .row{display:flex;align-items:center;gap:12px;padding:10px 12px}
.player img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.player .tt{flex:1;min-width:0}
.player .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .tt span{font-size:.78rem;opacity:.75}
.player button{width:42px;height:42px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.player button.x2{background:transparent;color:var(--bg);font-size:1.4rem}
.player button svg{width:18px;height:18px}
.player .bar{height:3px;background:rgba(255,255,255,.18)}
.player .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s linear}
@media (max-width:760px){ .player{bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 10px)} }

/* ---------- Vé / thanh toán ---------- */
#viewTicket .container{max-width:560px;padding-block:28px 40px}
#viewTicket h1{font-size:1.6rem;letter-spacing:-.4px;margin:0 0 8px}
.ticket{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:18px;border-radius:16px;background:linear-gradient(135deg,var(--red),#5e1216);color:#fff;margin:18px 0;position:relative;overflow:hidden}
.ticket::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:18px solid rgba(255,255,255,.08)}
.ticket .k{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.ticket .price{font-size:1.7rem;font-weight:800}
.ticket .v{grid-column:1/-1;opacity:.85;font-size:.9rem}
.paylist{display:grid;gap:10px}
.payopt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.payopt:hover{border-color:var(--red)}
.payopt .pi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--red);flex:none}
.payopt .pi svg{width:22px;height:22px}
.payopt b{display:block;color:var(--ink)}
.payopt b + span{display:block;font-size:.84rem;color:var(--muted)}
.payopt:disabled{opacity:.55}
.bigcode{font-size:2.4rem;letter-spacing:.2em;font-weight:800;text-align:center;margin:12px 0;font-variant-numeric:tabular-nums}
#shortInput{width:100%;padding:14px;font-size:1.5rem;letter-spacing:.25em;text-align:center;text-transform:uppercase;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-family:inherit}
.spinner{width:44px;height:44px;border:4px solid var(--surface-2);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;margin:24px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spinner{animation-duration:3s} .poi{transition:none} }
.welcome{position:relative;overflow:hidden;color:#fff;border-radius:18px;padding:26px 22px 30px;margin-bottom:6px;
  background:radial-gradient(120% 90% at 85% 10%, rgba(246,190,110,.55), transparent 55%), linear-gradient(160deg,#5a1a1f 0%,#3a1418 55%,#1d0f14 100%)}
.welcome::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-48px;height:80px;background:#140a0d;border-radius:50% 50% 0 0;opacity:.55}
.welcome > *{position:relative;z-index:1}
.welcome .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#f3d38e}
.welcome .eyebrow::before{content:"";width:22px;height:2px;background:#f3d38e}
#viewTicket .welcome h1{font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.1;margin:8px 0 4px;color:#fff}
.welcome .place{font-weight:600;opacity:.9}
.welcome p{opacity:.92;margin:10px 0 14px}
.payh{font-size:1.15rem;margin:22px 0 0}
body.locked .tabs, body.locked .bottomnav, body.locked #ticketPill{display:none!important}
.qr{display:block;margin:12px auto;width:260px;max-width:80%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.center{text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:1700;max-width:min(92%,520px);text-align:center;font-size:.9rem;box-shadow:var(--shadow)}
@media (max-width:760px){ .toast{bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 80px)} }
</style>
</head>
<body>

<!-- Biểu tượng dùng lại -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = {
  get: (k, s) => { try { return (s ? sessionStorage : localStorage).getItem(k); } catch { return null; } },
  set: (k, v, s) => { try { (s ? sessionStorage : localStorage).setItem(k, v); } catch { /* đầy hoặc bị chặn */ } },
  del: (k, s) => { try { (s ? sessionStorage : localStorage).removeItem(k); } catch { /* bỏ qua */ } },
};
function normalizeLang(l) {
  l = (l || '').toLowerCase();
  if (l.startsWith('vi')) return 'vi';
  if (l.startsWith('zh')) return 'zh-CN';
  for (const c of ['ja', 'ko', 'fr', 'en']) if (l.startsWith(c)) return c;
  return 'en';
}
let lang = store.get(K.lang) || normalizeLang(navigator.language);
const t = (key) => (T[lang] && T[lang][key]) ?? T.en[key] ?? key;

// ---------- Chữ giao diện cho ngôn ngữ ngoài vi/en: dịch tự động từ bảng T.en ----------
// Server dịch một lần cho mỗi ngôn ngữ (cache RAM); app lưu bản dịch vào localStorage, lần sau mở là có ngay.
// Khoá cache gồm "hash" của bảng T.en: sửa chữ tiếng Anh trong code thì bản dịch cũ tự bị bỏ.
let serverLangs = null;                                    // danh sách ngôn ngữ lấy từ server (biến LANGUAGES)
const langList = () => (dataset && dataset.languages && dataset.languages.length) ? dataset.languages : (serverLangs || ALL_LANGS);
const uiHash = (() => { const s = JSON.stringify(T.en); let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); })();
const uiLoading = {};
async function loadUiStrings(code) {
  if (T[code]) return true;                                // vi, en có sẵn; ngôn ngữ đã dịch trong phiên này
  const key = 'll_ui:' + code + ':' + uiHash;
  try { const c = JSON.parse(store.get(key) || 'null'); if (c) { T[code] = c; return true; } } catch { /* bỏ qua */ }
  if (!uiLoading[code]) {
    uiLoading[code] = api('POST', '/poi/i18n', { body: { lang: code, source: 'en', strings: T.en } })
      .then((r) => {
        if (r.status !== 200 || !r.data || !r.data.strings) return false;
        T[code] = r.data.strings; store.set(key, JSON.stringify(r.data.strings)); return true;
      })
      .catch(() => false)
      .finally(() => { delete uiLoading[code]; });
  }
  return uiLoading[code];
}
// Tải chữ giao diện cho ngôn ngữ hiện tại; xong thì vẽ lại các phần có chữ (trong lúc chờ hiện tiếng Anh)
function ensureUi(code) {
  if (T[code]) return;
  loadUiStrings(code).then((ok) => { if (ok && lang === code) rerenderAll(); });
}

// ---------- API & token ----------
function tokenExp(tok) {
  try { return (JSON.parse(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp || 0) * 1000; } catch { return 0; }
}
function getToken() {
  const tk = store.get(K.token);
  return tk && tokenExp(tk) > Date.now() + 5000 ? tk : null;
}
async function api(method, path, { body, auth, headers } = {}) {
  const h = { ...(body ? { 'content-type': 'application/json' } : {}), ...(headers || {}) };
  if (auth) {
    const tk = getToken();
    if (!tk) { logout(true); return { status: 401, data: null }; }
    h.authorization = 'Bearer ' + tk;
  }
  const res = await fetch(API + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  let data = null; try { data = await res.json(); } catch { /* 304 hoặc rỗng */ }
  if (res.status === 401 && auth) logout(true);
  return { status: res.status, data };
}
const errCode = (r) => (r && r.data && r.data.error && r.data.error.code) || ('HTTP_' + (r && r.status));

// ---------- Báo "đang online" cho dashboard admin ----------
// Khi trang đang mở: gửi heartbeat mỗi 30 giây. Khi đóng tab / rời trang: gửi leave.
// keepalive: true để trình duyệt vẫn gửi được request dù trang đang bị đóng (khác fetch thường).
const HEARTBEAT_MS = 30000;
let hbTimer = null;
function sendPresence(kind) {
  const tk = getToken();
  if (!tk) return;
  fetch(API + '/presence/' + kind, { method: 'POST', headers: { authorization: 'Bearer ' + tk }, keepalive: true }).catch(() => {});
}
function startPresence() {
  if (hbTimer || !getToken()) return;
  sendPresence('heartbeat');
  hbTimer = setInterval(() => { if (getToken()) sendPresence('heartbeat'); else stopPresence(false); }, HEARTBEAT_MS);
}
function stopPresence(leave) {
  clearInterval(hbTimer); hbTimer = null;
  if (leave) sendPresence('leave');
}
window.addEventListener('pagehide', () => stopPresence(true));               // đóng tab, tải lại, chuyển trang
window.addEventListener('pageshow', (e) => { if (e.persisted) startPresence(); }); // quay lại bằng nút Back (bfcache)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && hbTimer) sendPresence('heartbeat'); });

function logout(expired) {
  stopPresence(true);
  store.del(K.token); autoplay = false; $('btnAuto').classList.remove('on');
  stopSpeech(); if (!$('detail').classList.contains('hidden')) closeDetail();
  $('banner').classList.add('hidden');
  dataset = null; engine = null; renderGrid(); renderList(); if (map) drawPois();
  showPay();
  if (expired) toast(t('ticketExpired'), 6000);
}
async function saveToken(data) {
  store.set(K.token, data.accessToken);
  store.del(PENDING, true); store.del(PENDING_MOMO, true);
  await loadAndRender();
  startPresence();
  setView('home'); toast(t('unlocked'), 5000);
}

async function showPay() {
  showPayScreen('screenPay'); renderStatic();
  try {
    const r = await api('GET', '/payments/products');
    if (r.status === 200 && r.data && r.data.length) {
      product = r.data.find((p) => p.code === 'DAY_PASS') || r.data[0];
      renderPrice();
    }
  } catch { $('priceText').textContent = t('networkError'); }
}

  const box = $('payLangs'); if (!box) return; box.innerHTML = '';
  const list = langList();
  list.forEach((l) => { const b = el('button', l.code === lang ? 'on' : '', l.nativeName || l.name); b.type = 'button'; b.onclick = () => setLang(l.code); box.appendChild(b); });
}

  $('validText').textContent = t('validFor').replace('{h}', product.validity_hours);

  $('btnOnline').disabled = true;
  try {
    const r = await api('POST', '/payments/online', { body: { productCode: (product && product.code) || 'DAY_PASS', lang } });
    if (r.status === 201) { store.set(PENDING, r.data.authCode, true); location.href = r.data.paymentUrl; return; }
    showMessage(t('errTitle'), t('errPayment') + ' (' + errCode(r) + ')', t('back'), showPay);
  } catch { showMessage(t('errTitle'), t('networkError'), t('back'), showPay); }
  finally { $('btnOnline').disabled = false; }
}
async function payCash() {
  $('btnCash').disabled = true;
  try {
    const r = await api('POST', '/payments/cash', { body: { productCode: (product && product.code) || 'DAY_PASS', lang } });
    if (r.status !== 201) { showMessage(t('errTitle'), t('errPayment') + ' (' + errCode(r) + ')', t('back'), showPay); return; }
    showPayScreen('screenCash');
    $('orderCode').textContent = r.data.orderCode;
    $('cashAmount').textContent = fmtMoney(r.data.amount, r.data.currency);
    $('cashStatus').textContent = t('cashWaiting'); $('shortMsg').textContent = ''; $('shortInput').value = '';
    clearInterval(cashPoll);
    cashPoll = setInterval(async () => {
      try {
        const s = await api('GET', '/payments/orders/' + encodeURIComponent(r.data.orderCode));
        if (s.status !== 200) return;
        const st = s.data.status;
        $('cashStatus').textContent = st === 'PAID' ? t('cashPaid') : st === 'PENDING' ? t('cashWaiting') : t('cashExpired');
        if (st !== 'PENDING') clearInterval(cashPoll);
      } catch { /* thử lại lần sau */ }
    }, 3000);
  } catch { showMessage(t('errTitle'), t('networkError'), t('back'), showPay); }
  finally { $('btnCash').disabled = false; }
}

async function momoPoll(authCode) {
  const my = ++momoToken;
  for (let i = 0; i < 450 && my === momoToken; i++) {
    try {
      const r = await api('POST', '/auth/exchange', { body: { authCode, lang } });
      if (my !== momoToken) return;
      if (r.status === 200) { momoToken++; saveToken(r.data); return; }
      if (r.status !== 202) {
        momoToken++; store.del(PENDING_MOMO, true);
        showMessage(t('errTitle'), t('momoExpired') + ' (' + errCode(r) + ')', t('payAgain'), showPay);
        return;
      }
    } catch { /* mất mạng: thử lại */ }
    await sleep(4000);
  }
}
async function submitShortCode() {
  const code = $('shortInput').value.trim();
  if (!code) return;
  $('shortMsg').textContent = '';
  try {
    const r = await api('POST', '/auth/exchange-short', { body: { shortCode: code, lang } });
    if (r.status === 200) { clearInterval(cashPoll); saveToken(r.data); return; }
    $('shortMsg').textContent = r.status === 429 ? t('codeLocked') : r.status === 202 ? t('cashNotYet') : t('codeInvalid');
  } catch { $('shortMsg').textContent = t('networkError'); }
}
async function startPolling(authCode) {
  if (polling) return;
  polling = true; showPayScreen('screenWait');
  for (let i = 1; i <= 20; i++) {
    $('waitProgress').textContent = i + '/20';
    try {
      const r = await api('POST', '/auth/exchange', { body: { authCode, lang } });
      if (r.status === 200) { polling = false; saveToken(r.data); return; }
      if (r.status !== 202) {
        polling = false; store.del(PENDING, true);
        showMessage(t('errTitle'), t('errCode') + ' (' + errCode(r) + ')', t('payAgain'), showPay);
        return;
      }
    } catch { /* mất mạng: thử lại */ }
    await sleep(3000);
  }
  polling = false;
  showMessage(t('waitFailTitle'), t('waitFailText'), t('retry'), () => startPolling(authCode));
}
function handleReturn() {
  const code = params.get('auth_code'), status = params.get('status');
  history.replaceState(null, '', '/');
  if (status === 'failed') {
    store.del(PENDING, true);
    showMessage(t('payFailTitle'), t('payFailText'), t('payAgain'), showPay);
    return;
  }
  if (code) { store.set(PENDING, code, true); startPolling(code); } else showPay();
}
function openTicket() {
  const pm = store.get(PENDING_MOMO, true);
  if (pm) { try { showMomo(JSON.parse(pm)); return; } catch { store.del(PENDING_MOMO, true); } }
  showPay();
}

// ---------- Dữ liệu: tải theo ngôn ngữ đang chọn ----------
// Server dịch từ bản tiếng Việt khi có người chọn ngôn ngữ đó (không lưu bản dịch trong CSDL).
// Mỗi ngôn ngữ cache riêng một bản trong localStorage; gửi lại ETag server trả về để nhận 304 nếu chưa đổi.
async function fetchVersioned(path, key, auth) {
  let cached = null;
  try { cached = JSON.parse(store.get(key) || 'null'); } catch { /* bỏ qua */ }
  const headers = cached && cached.etag ? { 'if-none-match': cached.etag } : {};
  const r = await api('GET', path, { auth, headers });
  if (r.status === 200) { store.set(key, JSON.stringify(r.data)); return { data: r.data }; }
  if (r.status === 304 && cached) return { data: cached };
  if (r.status === 404) return { data: { version: 0, languages: [], categories: [], pois: [], tours: [] }, empty: true };
  if (r.status === 401) return { unauthorized: true };
  if (cached) return { data: cached };
  return { error: errCode(r) };
}
// Chỉ tải được dữ liệu khi đã có vé (token). Không có vé thì không có nội dung nào.
async function loadData() {
  emptyMsg = '';
  if (!getToken()) { dataset = null; return; }
  let res;
  const key = K.data + ':' + lang;
  try {
    res = await fetchVersioned('/poi/dataset/latest?lang=' + encodeURIComponent(lang), key, true);
    if (res.unauthorized) { dataset = null; return; }
  } catch {
    const c = store.get(key);
    res = c ? { data: JSON.parse(c) } : { error: 'NETWORK' };
  }
  if (res.empty) emptyMsg = t('noDataset');
  dataset = res.data || null;
  if (dataset && dataset.translationFailed) toast(t('translateFail'), 6000);
  if (res.error) emptyMsg = res.error === 'NETWORK' ? t('networkError') : t('errTitle') + ' (' + res.error + ')';
}
async function loadAndRender() {
  await loadData();
  engine = dataset ? new Geofence(dataset.pois) : null;
  buildLangMenu(); renderStatic(); renderHero(); renderChips(); renderGrid(); renderList();
  if (map) drawPois();
  if (currentPoi && dataset) { const p = dataset.pois.find((x) => x.id === currentPoi.id); if (p) fillDetail(p); }
}

// ---------- GPS & geofence ----------
function haversine(a, b) {
  const R = 6371000, rad = (d) => (d * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
class Geofence {
  constructor(pois, opts) {
    this.pois = pois; this.inside = new Set(); this.last = new Map();
    this.o = Object.assign({ exitBufferM: 10, cooldownMs: 5 * 60000, maxAccuracyM: 50 }, opts || {});
  }
  update(fix, now = Date.now()) {
    if (fix.accuracy > this.o.maxAccuracyM) return null;
    const entered = [];
    for (const p of this.pois) {
      const d = haversine(fix, { lat: p.lat, lng: p.lng }), was = this.inside.has(p.id);
      if (!was && d <= p.triggerRadiusM) {
        this.inside.add(p.id);
        const lastT = this.last.get(p.id);
        if (lastT === undefined || now - lastT >= this.o.cooldownMs) entered.push({ p, d });
      } else if (was && d >= p.triggerRadiusM + this.o.exitBufferM) this.inside.delete(p.id);
    }
    if (!entered.length) return null;
    entered.sort((a, b) => b.p.priority - a.p.priority || a.d - b.d);
    this.last.set(entered[0].p.id, now);
    return entered[0].p;
  }
}
function startGps() {
  if (watchId !== null) return;
  if (!('geolocation' in navigator)) { toast(t('gpsDenied')); return; }
  watchId = navigator.geolocation.watchPosition(
    (pos) => { if (!simOn) setFix({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy || 999 }); },
    (err) => toast(err.code === 1 ? t('gpsDenied') : t('gpsWeak')),
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
  );
  renderTicketState();
}
let lastListRender = 0;
function setFix(fix) {
  const first = !lastFix;
  lastFix = fix; drawUser(fix);
  if (!dataset) return;
  let nearest = Infinity;
  dataset.pois.forEach((p) => {
    const d = haversine(fix, { lat: p.lat, lng: p.lng });
    nearest = Math.min(nearest, d);
    const m = markers.get(p.id), e = m && m.marker.getElement();
    if (e) { const pin = e.querySelector('.pin'); if (pin) pin.classList.toggle('near', d <= 100); }
  });
  if (first) {
    renderTicketState();
    if (map && nearest < 2000) map.setView([fix.lat, fix.lng], Math.max(map.getZoom(), 17));
    else if (nearest !== Infinity && nearest >= 2000) toast(t('farAway').replace('{km}', (nearest / 1000).toFixed(1)));
  }
  // Cập nhật khoảng cách trên thẻ / danh sách tối đa 5 giây một lần để đỡ tốn pin
  if (first || Date.now() - lastListRender > 5000) { lastListRender = Date.now(); renderGrid(); renderList(); }
  const picked = engine && engine.update(fix);
  if (picked) onEnter(picked);
  updateDistance();
}
function onEnter(poi) {
  if (autoplay) { openDetail(poi); playPoi(poi); } else showBanner(poi);
}
function showBanner(poi) {
  const { c } = content(poi);
  bannerPoi = poi;
  setImg($('bannerImg'), poi);
  const name = (c && c.name) || poi.code;
  $('bannerText').textContent = t('nearYou') + ' ' + name;
  $('bannerListen').textContent = t('listen');
  $('banner').classList.remove('hidden');
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => $('banner').classList.add('hidden'), 15000);
}

// ---------- Chi tiết POI ----------
function fillDetail(poi) {
  const { c, code, fallback } = content(poi), cat = catOf(poi);
  const imgs = imagesOf(poi);
  galleryIdx = Math.min(galleryIdx, Math.max(imgs.length - 1, 0));
  setImg($('dImg'), poi, imgs[galleryIdx]);
  $('dImg').alt = (c && c.name) || poi.code;
  const dots = $('dDots'); dots.innerHTML = '';
  if (imgs.length > 1) imgs.forEach((src, i) => {
    const b = el('button', i === galleryIdx ? 'on' : ''); b.setAttribute('aria-label', String(i + 1));
    b.onclick = () => { galleryIdx = i; fillDetail(poi); }; dots.appendChild(b);
  });
  const meta = $('dMeta'); meta.innerHTML = '';
  const ct = el('span', 'cat'); const dot = el('i'); dot.style.background = cat.color; ct.appendChild(dot); ct.appendChild(document.createTextNode(cat.name));
  meta.appendChild(ct); meta.appendChild(el('span', '', '#' + indexOf(poi)));
  $('dTitle').textContent = (c && c.name) || poi.code;
  $('dShort').textContent = (c && c.shortDescription) || '';
  $('dDesc').textContent = (c && c.description) || '';
  $('dNote').textContent = fallback && code ? t('fallbackNote').replace('{lang}', langName(code)) : '';
  $('dAudio').textContent = c && c.audioUrl ? t('audioPre') : t('audioLocal');
  $('btnDir').href = 'https://www.google.com/maps/dir/?api=1&destination=' + poi.lat + ',' + poi.lng + '&travelmode=walking';
  setSpeakingUi();
  updateDistance();
}
function openDetail(poi) {
  if (currentPoi && currentPoi.id !== poi.id) galleryIdx = 0;
  currentPoi = poi; fillDetail(poi);
  $('detail').classList.remove('hidden'); $('banner').classList.add('hidden');
  document.body.style.overflow = 'hidden';
}
function closeDetail() {
  $('detail').classList.add('hidden'); document.body.style.overflow = '';
  currentPoi = null; galleryIdx = 0;
  if (routeLine) { routeLine.remove(); routeLine = null; }
}
function updateDistance() {
  if (!currentPoi || !lastFix) { $('dDist').textContent = ''; return; }
  const d = haversine(lastFix, { lat: currentPoi.lat, lng: currentPoi.lng });
  $('dDist').textContent = t('distAway').replace('{m}', fmtDist(d));
  if (!map) return;
  const pts = [[lastFix.lat, lastFix.lng], [currentPoi.lat, currentPoi.lng]];
  if (routeLine) routeLine.setLatLngs(pts);
  else routeLine = L.polyline(pts, { color: '#2563eb', weight: 3, dashArray: '6 8' }).addTo(map);
}

// ---------- Phát thuyết minh: MP3 dựng sẵn → giọng đọc của thiết bị ----------
let voices = [];
const hasTts = 'speechSynthesis' in window;
function loadVoices() { voices = hasTts ? speechSynthesis.getVoices() : []; }
if (hasTts) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function voiceFor(bcp) {
  const pre = bcp.split('-')[0].toLowerCase();
  return voices.find((v) => v.lang.toLowerCase() === bcp.toLowerCase()) || voices.find((v) => v.lang.toLowerCase().startsWith(pre));
}
function chunk(text) {
  const parts = text.replace(/\s+/g, ' ').match(/[^.!?。！？]+[.!?。！？]?/g) || [text];
  const out = []; let cur = '';
  for (const p of parts) {
    if ((cur + p).length > 180 && cur) { out.push(cur.trim()); cur = p; } else cur += p;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function speak(text, code) {
  if (!hasTts) { toast(t('noVoice')); stopSpeech(); return false; }
  const bcp = TTS_LANG[code] || 'en-US', v = voiceFor(bcp);
  if (!v && voices.length) { toast(t('noVoice')); stopSpeech(); return false; }
  speechSynthesis.cancel();
  const tok = ++speakTok, parts = chunk(text);
  parts.forEach((part, i) => {
    const u = new SpeechSynthesisUtterance(part);
    u.lang = bcp; u.rate = 0.95; if (v) u.voice = v;
    u.onstart = () => { if (tok === speakTok) setProgress((i + 0.5) / parts.length); };
    if (i === parts.length - 1) u.onend = () => { if (tok === speakTok) endPlayback(); };
    u.onerror = () => { if (tok === speakTok) endPlayback(); };
    speechSynthesis.speak(u);
  });
  return true;
}
const player = new Audio();
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
player.ontimeupdate = () => { if (player.duration) setProgress(player.currentTime / player.duration); };
// Audio do server tạo theo yêu cầu (/api/poi/tts/...) cần token. Thẻ <audio src> không gửi được header
// Authorization nên tải bằng fetch rồi phát từ blob. Giữ blob trong phiên để nghe lại không phải tải lại.
const audioBlobs = new Map();
async function audioSrc(url) {
  if (!url.startsWith(API + '/')) return url;
  if (audioBlobs.has(url)) return audioBlobs.get(url);
  const tk = getToken();
  if (!tk) throw new Error('NO_TOKEN');
  const r = await fetch(url, { headers: { authorization: 'Bearer ' + tk } });
  if (!r.ok) throw new Error('HTTP_' + r.status);
  const src = URL.createObjectURL(await r.blob());
  audioBlobs.set(url, src);
  return src;
}
function playAudio(url, onFail) {
  const tok = speakTok;
  player.onended = () => { if (tok === speakTok) endPlayback(); };
  player.onerror = () => { if (tok === speakTok) onFail(); };
  audioSrc(url)
    .then((src) => { if (tok !== speakTok) return; player.src = src; return player.play(); })
    .catch(() => { if (tok === speakTok) onFail(); });   // lỗi mạng/TTS -> đọc bằng giọng của thiết bị
}
function playPoi(poi) {
  const { c, code } = content(poi);
  if (!c) return;
  haltAudio();
  nowPlaying = poi.id; speakTok++;
  let sub, ok = true;
  const text = [c.name, c.description].filter(Boolean).join('. ');
  if (c.audioUrl) { sub = t('audioPre'); playAudio(c.audioUrl, () => { $('pSub').textContent = t('playing') + ' · ' + t('audioLocal'); speak(text, code); }); }
  else { sub = t('audioLocal'); ok = speak(text, code); }
  if (ok) showPlayer(poi, sub);
}
function togglePlay(poi) { if (nowPlaying === poi.id) stopSpeech(); else playPoi(poi); }
function haltAudio() { player.onended = null; player.onerror = null; player.pause(); if (hasTts) speechSynthesis.cancel(); }
function stopSpeech() { speakTok++; haltAudio(); endPlayback(); }
function endPlayback() { nowPlaying = null; $('player').classList.add('hidden'); setProgress(0); setSpeakingUi(); }
function showPlayer(poi, sub) {
  const { c } = content(poi);
  setImg($('pImg'), poi);
  $('pTitle').textContent = (c && c.name) || poi.code;
  $('pSub').textContent = t('playing') + ' · ' + sub;
  $('pIcon').setAttribute('href', '#i-pause');
  $('player').classList.remove('hidden');
  setProgress(0); setSpeakingUi();
}
function setProgress(f) { $('pBar').style.width = Math.max(0, Math.min(1, f)) * 100 + '%'; }
function setSpeakingUi() {
  const on = !!(currentPoi && nowPlaying === currentPoi.id);
  $('btnListen').classList.toggle('hidden', on); $('btnStop').classList.toggle('hidden', !on);
  document.querySelectorAll('.poi[data-id], .item[data-id]').forEach((n) => {
    const playing = n.dataset.id === nowPlaying;
    n.classList.toggle('playing', playing);
    const u = n.querySelector('.play use, .pl use'); if (u) u.setAttribute('href', playing ? '#i-stop' : '#i-play');
  });
}
function togglePause() {
  if (!nowPlaying) return;
  if (player.src && !player.paused) { player.pause(); $('pIcon').setAttribute('href', '#i-play'); return; }
  if (player.src && player.paused && player.currentTime > 0 && !player.ended) { player.play().catch(() => {}); $('pIcon').setAttribute('href', '#i-pause'); return; }
  if (hasTts && speechSynthesis.speaking) {
    if (speechSynthesis.paused) { speechSynthesis.resume(); $('pIcon').setAttribute('href', '#i-pause'); }
    else { speechSynthesis.pause(); $('pIcon').setAttribute('href', '#i-play'); }
  }
}

// ---------- Ngôn ngữ ----------
function buildLangMenu() {
  const list = langList();
  const menu = $('langMenu'); menu.innerHTML = '';
  list.forEach((l) => {
    const b = el('button', l.code === lang ? 'active' : '');
    b.appendChild(el('span', '', l.nativeName || l.name)); b.appendChild(el('span', 'muted small', l.code));
    b.onclick = () => setLang(l.code);
    menu.appendChild(b);
  });
}
function setLang(code) {
  lang = code; store.set(K.lang, code);
  stopSpeech(); renderStatic(); buildLangMenu(); renderHero(); renderChips(); renderGrid(); renderList(); renderPrice();
  $('langMenu').classList.add('hidden');
  if (currentPoi) fillDetail(currentPoi);
  if (map) drawPois();
  ensureUi(code);   // chữ giao diện (nút, tiêu đề...) của ngôn ngữ mới
  // Nội dung quán: tải bản dịch của ngôn ngữ mới (lần đầu server dịch mất vài giây, sau đó có ngay)
  if (getToken() && dataset && dataset.lang !== code) {
    if (!dataset.pois.some((p) => p.translations && p.translations[code])) toast(t('translating'), 3000);
    loadAndRender();
  }
}

// ---------- Sự kiện ----------
document.querySelectorAll('[data-view]').forEach((b) => { b.onclick = () => (b.dataset.view === 'ticket' ? openTicket() : setView(b.dataset.view)); });
$('brandBtn').onclick = () => setView('home');
$('ticketPill').onclick = () => (getToken() ? setView('map') : openTicket());
$('heroMap').onclick = () => setView('map');
$('stBtn').onclick = () => (getToken() ? setView('map') : openTicket());
$('stGps').onclick = startGps;
$('search').addEventListener('input', (e) => { query = e.target.value; renderList(); });
$('btnOnline').onclick = payOnline;
$('btnCash').onclick = payCash;
$('btnMomo').onclick = payMomo;
$('btnMomoBack').onclick = () => { momoToken++; store.del(PENDING_MOMO, true); showPay(); };
$('btnShort').onclick = submitShortCode;
$('shortInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitShortCode(); });
$('btnCashBack').onclick = () => { clearInterval(cashPoll); showPay(); };
$('langBtn').onclick = () => $('langMenu').classList.toggle('hidden');
document.addEventListener('click', (e) => { if (!e.target.closest('#langMenu, #langBtn')) $('langMenu').classList.add('hidden'); });
$('detailClose').onclick = closeDetail; $('detailBack').onclick = closeDetail;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('detail').classList.contains('hidden')) closeDetail(); });
$('btnOnMap').onclick = () => { const p = currentPoi; closeDetail(); if (!p) return; setView('map'); setTimeout(() => selectPoi(p, true), 60); };
$('bannerClose').onclick = () => $('banner').classList.add('hidden');
$('bannerListen').onclick = () => { if (bannerPoi) { openDetail(bannerPoi); playPoi(bannerPoi); } };
$('btnListen').onclick = () => { if (currentPoi) playPoi(currentPoi); };
$('btnStop').onclick = stopSpeech;
$('pToggle').onclick = togglePause;
$('pClose').onclick = stopSpeech;
$('btnLocate').onclick = () => {
  startGps();
  if (lastFix && map) map.setView([lastFix.lat, lastFix.lng], 18); else toast(t('gpsWeak'));
};
$('btnAuto').onclick = () => {
  autoplay = !autoplay;
  $('btnAuto').classList.toggle('on', autoplay); renderStatic();
  toast(autoplay ? t('autoOn') : t('autoOff'));
  // Trình duyệt (nhất là iOS) chỉ cho đọc sau một thao tác chạm: đọc câu ngắn để "mở khóa"
  if (autoplay) { player.src = SILENT; player.play().catch(() => {}); if (hasTts) { const u = new SpeechSynthesisUtterance(t('autoOnSpeech')); u.lang = TTS_LANG[lang] || 'en-US'; speechSynthesis.speak(u); } }
};
$('btnSim').onclick = () => {
  simOn = !simOn; $('btnSim').classList.toggle('on', simOn);
  toast(simOn ? t('simOn') : t('simOff'));
};

// ---------- Khởi động ----------
async function boot() {
  renderStatic(); buildLangMenu();
  ensureUi(lang);
  // Danh sách ngôn ngữ theo cấu hình server (để màn hình chào mừng hiện đúng cả khi chưa có vé)
  api('GET', '/poi/languages').then((r) => {
    if (r.status === 200 && Array.isArray(r.data) && r.data.length) { serverLangs = r.data; renderStatic(); buildLangMenu(); renderHero(); }
  }).catch(() => {});
  const onReturn = location.pathname.startsWith('/payment/return');
  if (getToken()) await loadAndRender();
  if (onReturn) return handleReturn();
  if (!getToken()) {
    const pm = store.get(PENDING_MOMO, true);
    if (pm) { try { return showMomo(JSON.parse(pm)); } catch { store.del(PENDING_MOMO, true); } }
    const pending = store.get(PENDING, true);
    if (pending) return startPolling(pending);
  }
  if (!getToken()) { showPay(); return; }
  startPresence();
  setView('home');
  // Vé hết hạn trong lúc đang dùng: khóa app, quay về màn hình mua vé
  setInterval(() => { if (dataset && !getToken()) logout(true); }, 60000);
}
boot();
})();
</script>
