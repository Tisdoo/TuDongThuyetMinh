<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quầy nhân viên - Chùa Linh Ứng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#eceae4; --ink:#1c1f1e; --muted:#5d6461; --line:#dcdad3;
  --red:#8f1d22; --red-2:#b3262d; --on-red:#ffffff; --gold:#a8741c; --sea:#17656e; --ok:#1f7a3f; --warn:#8a5a00;
  --ok-bg:#e3f3e8; --warn-bg:#fbefd6; --err-bg:#f8e1df;
  --shadow:0 1px 2px rgba(20,20,20,.05), 0 4px 16px rgba(20,20,20,.06);
  --font:"Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#121514; --surface:#1a1e1d; --surface-2:#232827; --ink:#e8eae6; --muted:#a3aba7; --line:#2d3331;
  --red:#d9545a; --red-2:#e8686e; --on-red:#1b0b0c; --gold:#d8a64e; --sea:#5fb2ba; --ok:#6fd393; --warn:#f0c35a;
  --ok-bg:#16301f; --warn-bg:#352a10; --err-bg:#3a1a19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3); color-scheme:dark; } }
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.topbar .logo{width:34px;height:34px;flex:none}
.topbar b{display:block;font-weight:800;font-size:1.02rem;letter-spacing:-.2px}
.topbar small{display:block;color:var(--muted);font-size:.76rem}
.topbar .sp{flex:1}
.topbar a{color:var(--muted);text-decoration:none;font-size:.86rem;font-weight:600}
.topbar a:hover{color:var(--ink)}
@media (max-width:560px){ .topbar a{display:none} }
.wrap{max-width:var(--maxw,1000px);margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
main.wrap{padding-block:22px 48px}
h1{font-size:1.5rem;letter-spacing:-.4px;margin:0 0 6px;color:var(--ink)}
h2{font-size:1.08rem;letter-spacing:-.2px;margin:26px 0 10px}
a{color:var(--sea)}
label{display:block;font-size:.86rem;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0;width:100%;max-width:100%}
input[type=checkbox]{width:auto;accent-color:var(--red)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb, var(--sea) 45%, transparent);border-color:var(--sea)}
textarea{min-height:80px;resize:vertical}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;margin:4px 6px 4px 0;font-weight:600;width:auto}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.55;cursor:default}
button.primary,.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
button.primary:hover{background:var(--red-2);border-color:var(--red-2)}
button.alt{background:var(--surface);color:var(--red);border-color:var(--red)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow);overflow-x:auto}
.muted{color:var(--muted)} .err{color:var(--red)} .ok{color:var(--ok)}
.hidden{display:none!important}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:700;white-space:nowrap}
td,th{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
td button{padding:6px 10px;font-size:.84rem;margin:2px 4px 2px 0}
pre{background:var(--surface-2);color:var(--ink);padding:12px;border-radius:10px;overflow:auto;max-height:280px;font-size:.84rem}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px;background:var(--surface-2);border-radius:12px;margin:10px 0 4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;margin:0;padding:8px 14px;border-radius:9px;color:var(--muted);white-space:nowrap}
nav.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.leaflet-container{font-family:var(--font)}

#loginBox{max-width:420px;margin:30px auto}
#loginBox b{display:block;font-size:1.1rem;margin-bottom:8px}
#main > p:first-child{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .muted{font-weight:400;font-size:.86rem}
#orderCode{max-width:260px;display:inline-block;text-transform:uppercase;letter-spacing:.08em}
.code{font-size:3.2rem;letter-spacing:.3em;font-weight:800;text-align:center;margin:10px 0;color:var(--red);font-variant-numeric:tabular-nums}
#codeBox{text-align:center;border-color:var(--red)}
#orderBox > div:first-child{font-weight:600;margin-bottom:8px}
</style>
</head>
<body>
<header class="topbar" style="--maxw:820px"><div class="wrap"><svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#8f1d22"/><path d="M5 15.5 17 8l12 7.5h-3.2l-8.8-5.4-8.8 5.4zM8.5 16.5h17v1.8h-17zM10 19.5h2v7h-2zM16 19.5h2v7h-2zM22 19.5h2v7h-2zM7.5 27h19v1.8h-19z" fill="#f3d38e"/></svg><div><b>Quầy nhân viên</b><small>Chùa Linh Ứng · Xác nhận thu tiền</small></div><span class="sp"></span></div></header>
<main class="wrap" style="--maxw:820px">
<h1>Xác nhận thu tiền</h1>
<p class="muted">API: <span id="apiBase"></span></p>

<section id="loginBox" class="card">
  <b>Đăng nhập</b><br>
  <input id="user" placeholder="Tên đăng nhập" value="staff1">
  <input id="pass" type="password" placeholder="Mật khẩu" value="Staff@12345">
  <button class="primary" id="btnLogin">Đăng nhập</button>
  <div id="loginMsg" class="err"></div>
</section>

<section id="main" class="hidden">
  <p>Đã đăng nhập: <b id="who"></b> <button id="btnLogout">Đăng xuất</button></p>

  <h2>1. Đơn đang chờ: tiền mặt và MoMo QR <span class="muted">(tự làm mới mỗi 5 giây)</span></h2>
  <div id="pending" class="card muted">Đang tải...</div>

  <h2>2. Tìm đơn theo mã</h2>
  <input id="orderCode" placeholder="Mã đơn khách đọc" maxlength="12">
  <button id="btnFind">Tìm</button>
  <div id="orderBox" class="card hidden"></div>

  <h2>3. Mã truy cập cho khách</h2>
  <div id="codeBox" class="card hidden">
    <div class="muted">Đọc mã này cho khách nhập vào ứng dụng:</div>
    <div class="code" id="shortCode">------</div>
    <div class="muted">Hết hạn sau <span id="ttl">0</span> giây</div>
    <button id="btnReissue">Cấp lại mã</button>
  </div>
  <div id="msg"></div>
</section>

</main>

<script>
// Mở qua cổng 5175 (/staff/) hoặc ngrok: nginx chuyển /api sang Gateway. Mở ở cổng 5174: gọi thẳng Gateway 8080.
const API = location.port === '5174' ? location.protocol + '//' + location.hostname + ':8080/api' : '/api';
document.getElementById('apiBase').textContent = API;
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem('staffToken') || '';
let currentOrder = null;
let ttlTimer = null;

function say(text, cls) { $('msg').innerHTML = ''; const d = document.createElement('div'); d.className = cls || ''; d.textContent = text; $('msg').appendChild(d); }

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: { ...(body ? { 'content-type': 'application/json' } : {}), ...(token ? { authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null; try { data = await res.json(); } catch {}
  if (res.status === 401 && token) { logout(); throw new Error('Phiên hết hạn, đăng nhập lại'); }
  return { status: res.status, data };
}

async function login() {
  $('loginMsg').textContent = '';
  const r = await fetch(API + '/auth/staff/login', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ username: $('user').value, password: $('pass').value }),
  });
  const data = await r.json();
  if (!r.ok) { $('loginMsg').textContent = data?.error?.code || 'Lỗi đăng nhập'; return; }
  token = data.accessToken; sessionStorage.setItem('staffToken', token);
  $('who').textContent = $('user').value + ' (' + data.role + ')';
  showMain();
}
function logout() { token = ''; sessionStorage.removeItem('staffToken'); $('main').classList.add('hidden'); $('loginBox').classList.remove('hidden'); }
function showMain() { $('loginBox').classList.add('hidden'); $('main').classList.remove('hidden'); loadPending(); }

async function loadPending() {
  if (!token) return;
  try {
    const [cash, momo] = await Promise.all([
      api('GET', '/payments/admin/orders?method=CASH&status=PENDING&pageSize=20'),
      api('GET', '/payments/admin/orders?method=MOMO_QR&status=PENDING&pageSize=20'),
    ]);
    const items = [...cash.data.items, ...momo.data.items].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    const box = $('pending'); box.innerHTML = '';
    if (!items.length) { box.textContent = 'Không có đơn nào đang chờ.'; return; }
    const t = document.createElement('table');
    t.innerHTML = '<tr><th>Mã đơn</th><th>Hình thức</th><th>Số tiền</th><th>Tạo lúc</th><th></th></tr>';
    for (const o of items) {
      const tr = document.createElement('tr');
      const label = o.method === 'MOMO_QR' ? 'MoMo QR' : 'Tiền mặt';
      for (const v of [o.order_code, label, o.amount.toLocaleString('vi-VN') + ' đ', new Date(o.created_at).toLocaleTimeString('vi-VN')]) {
        const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      }
      const td = document.createElement('td'); const b = document.createElement('button'); b.textContent = 'Chọn';
      b.onclick = () => { $('orderCode').value = o.order_code; findOrder(); };
      td.appendChild(b); tr.appendChild(td); t.appendChild(tr);
    }
    box.appendChild(t);
  } catch (e) { /* bỏ qua, lần sau thử lại */ }
}

async function findOrder() {
  $('codeBox').classList.add('hidden'); say('');
  const code = $('orderCode').value.trim();
  if (!code) return;
  const { status, data } = await api('GET', '/payments/admin/orders/by-code/' + encodeURIComponent(code));
  const box = $('orderBox'); box.classList.remove('hidden'); box.innerHTML = '';
  if (status !== 200) { currentOrder = null; box.textContent = 'Không tìm thấy đơn.'; box.className = 'card err'; return; }
  currentOrder = data; box.className = 'card';
  const label = { CASH: 'Tiền mặt', MOMO_QR: 'MoMo QR', ONLINE: 'Online' }[data.method] || data.method;
  const info = document.createElement('div');
  info.textContent = `Đơn ${data.order_code} | ${label} | ${data.status} | ${Number(data.amount).toLocaleString('vi-VN')} đ | ${data.product_name}`;
  box.appendChild(info);
  const addBtn = (text, fn, primary) => { const b = document.createElement('button'); if (primary) b.className = 'primary'; b.textContent = text; b.onclick = fn; box.appendChild(b); };
  const addNote = (text, cls) => { const n = document.createElement('div'); n.className = cls || 'muted'; n.textContent = text; box.appendChild(n); };
  const money = Number(data.amount).toLocaleString('vi-VN') + ' đ';
  if (data.method === 'CASH' && data.status === 'PENDING') addBtn('Xác nhận ĐÃ THU ' + money, confirmCash, true);
  else if (data.method === 'CASH' && data.status === 'PAID') addBtn('Lấy / cấp lại mã', fetchShortCode);
  else if (data.method === 'MOMO_QR' && data.status === 'PENDING') {
    addNote('Mở app MoMo, tìm giao dịch có nội dung chuyển tiền = mã đơn và đúng số tiền, rồi mới bấm xác nhận.');
    addBtn('Xác nhận ĐÃ NHẬN ' + money + ' qua MoMo', confirmMomo, true);
  } else if (data.method === 'MOMO_QR' && data.status === 'PAID') addNote('Đã xác nhận. Khách tự được vào ứng dụng, không cần mã.', 'ok');
  else addNote('Đơn này không thể xác nhận thu tiền.', 'err');
}

// MoMo cá nhân không báo về server, nên nhân viên đối soát bằng tay. Mã giao dịch MoMo là duy nhất: một giao dịch không dùng cho hai đơn.
async function confirmMomo() {
  const txn = prompt('Nhập mã giao dịch MoMo (xem trong app MoMo, chi tiết giao dịch). Để trống nếu không có:');
  if (txn === null) return;
  const body = { amountReceived: Number(currentOrder.amount) };
  if (txn.trim()) body.momoTxnId = txn.trim();
  const { status, data } = await api('POST', `/payments/admin/orders/${currentOrder.id}/confirm-momo`, body);
  if (status !== 200) { say('Lỗi: ' + ((data && data.error && data.error.code) || status), 'err'); return; }
  say('Đã xác nhận nhận tiền MoMo. Khách sẽ tự được vào ứng dụng.', 'ok');
  loadPending(); findOrder();
}

async function confirmCash() {
  const { status, data } = await api('POST', `/payments/admin/orders/${currentOrder.id}/confirm-cash`, { amountReceived: Number(currentOrder.amount) });
  if (status !== 200) { say('Lỗi: ' + (data?.error?.code || status), 'err'); return; }
  say('Đã ghi nhận thu tiền. Đang lấy mã...', 'ok');
  fetchShortCode(); loadPending(); findOrder();
}

// Auth Service sinh mã sau khi nhận event => có thể trả 202 vài lần
async function fetchShortCode() {
  for (let i = 0; i < 10; i++) {
    const { status, data } = await api('GET', `/auth/staff/orders/${currentOrder.id}/short-code`);
    if (status === 200) return showCode(data.shortCode, data.expiresInSec);
    if (status === 410) { return reissue(); }
    if (status !== 202) { say('Lỗi: ' + (data?.error?.code || status), 'err'); return; }
    await new Promise((r) => setTimeout(r, 1000));
  }
  say('Chưa có mã, thử lại sau ít giây.', 'err');
}

async function reissue() {
  const { status, data } = await api('POST', `/auth/staff/orders/${currentOrder.id}/short-code/reissue`);
  if (status !== 200) { say('Không cấp lại được: ' + (data?.error?.code || status), 'err'); return; }
  showCode(data.shortCode, data.expiresInSec);
}

function showCode(code, ttl) {
  $('codeBox').classList.remove('hidden'); $('shortCode').textContent = code; say('');
  clearInterval(ttlTimer); let left = ttl; $('ttl').textContent = left;
  ttlTimer = setInterval(() => { left--; $('ttl').textContent = Math.max(left, 0); if (left <= 0) clearInterval(ttlTimer); }, 1000);
}

$('btnLogin').onclick = login; $('btnLogout').onclick = logout; $('btnFind').onclick = findOrder; $('btnReissue').onclick = reissue;
$('orderCode').addEventListener('keydown', (e) => { if (e.key === 'Enter') findOrder(); });
setInterval(loadPending, 5000);
if (token) { $('who').textContent = 'nhân viên'; showMain(); }
</script>
</body>
</html>
